<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /> 
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical B2B Admin | Admin Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body">
    <!-- Login Container -->
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-logo">MB</div>
          <div>
            <h1 class="brand-title">Medical B2B Admin</h1>
            <p class="brand-subtitle">Secure access for administrators only</p>
          </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="input"
              placeholder="admin@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="input"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Sign In
          </button>

          <p id="loginError" class="form-error" aria-live="polite"></p>
        </form>

        <p class="auth-footer-text">
          🔒 Admin Portal - Secure Access Only
        </p>
      </div>
    </div>

    <!-- Firebase Authentication Module -->
    <script type="module" src="js/auth.js"></script>
  </body>
  </html>
