plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

android {
    namespace 'com.example.medicalshopb2b'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.medicalshopb2b"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // 🔥 Firebase BOM
    implementation platform("com.google.firebase:firebase-bom:32.7.2")
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ✅ Firebase Auth (login/register)
    implementation libs.firebase.auth
    implementation 'com.google.android.material:material:1.11.0'

    // ✅ Firebase Realtime Database (FREE – NO BILLING)
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation "com.google.android.material:material:1.11.0"
    // RecyclerView (REQUIRED)
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.google.firebase:firebase-storage:20.3.0'
    // Material Components (Buttons, TextInput, etc.)
    implementation "com.google.android.material:material:1.11.0"
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // AppCompat
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    // ConstraintLayout (safe to keep)
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // ❌ REMOVE THESE (Firestore requires billing)
    // implementation(libs.firebase.firestore)
    // implementation(libs.firebase.messaging)
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
